version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: eyun-chatbot
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_NAME=${DB_NAME:-eyun_chatbot}
            - DB_USER=${DB_USER:-root}
            - DB_PASSWORD=${DB_PASSWORD:-Fy123456}
            - EYUN_BASE_URL=${EYUN_BASE_URL:-http://182.40.194.50:9899}
            - EYUN_TOKEN=${EYUN_TOKEN}
            - OPENCLAW_TOKEN=${OPENCLAW_TOKEN}
            - OPENCLAW_HTTP_URL=${OPENCLAW_HTTP_URL:-https://openclaw.dadaex.cn}
            - COZE_TOKEN=${COZE_TOKEN}
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - chatbot-network
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    mysql:
        image: mysql:8.0
        container_name: eyun-mysql
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-Fy123456}
            - MYSQL_DATABASE=${DB_NAME:-eyun_chatbot}
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        restart: unless-stopped
        networks:
            - chatbot-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Fy123456}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

networks:
    chatbot-network:
        driver: bridge

volumes:
    mysql_data:

